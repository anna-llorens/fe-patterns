services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: fe_patterns
      POSTGRES_PASSWORD: fe_patterns
      POSTGRES_DB: fe_patterns
    volumes:
      - fe_patterns_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fe_patterns -d fe_patterns"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://fe_patterns:fe_patterns@postgres:5432/fe_patterns
      PORT: "3001"
      DEFAULT_USER_EMAIL: demo@local.dev
      MARKET_DATA_PROVIDER: mock
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  fe_patterns_pg:
